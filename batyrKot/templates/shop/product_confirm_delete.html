{% extends 'base.html' %}

{% block title %}Удаление книги{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">⚠️ Подтверждение удаления</h5>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">Вы уверены, что хотите удалить книгу</p>
                <h4 class="text-danger">"{{ product.name }}"</h4>
                <p class="text-muted">Это действие невозможно отменить.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'users:profile' %}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-danger">🗑️ Да, удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
